appId: com.cutline.app
productName: Cutline
copyright: Copyright © Cutline

directories:
  output: dist
  buildResources: resources

files:
  - out/**/*
  - package.json
  - '!node_modules/ffmpeg-static/**'
  - '!node_modules/ffprobe-static/**'

extraResources:
  - from: node_modules/ffmpeg-static/ffmpeg.exe
    to: ffmpeg/ffmpeg.exe
  - from: node_modules/ffprobe-static/bin/win32/x64/ffprobe.exe
    to: ffmpeg/ffprobe.exe
  - from: resources/icon.ico
    to: icon.ico
  - from: resources/icon.png
    to: icon.png
  - from: THIRD_PARTY_LICENSES.txt
    to: THIRD_PARTY_LICENSES.txt

win:
  icon: resources/icon.ico
  target:
    - target: portable
      arch: [x64]
    - target: nsis
      arch: [x64]

portable:
  artifactName: ${productName}-${version}-portable.exe

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  artifactName: ${productName}-${version}-setup.exe

asar: true
